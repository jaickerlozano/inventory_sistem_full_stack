services:
  - type: web
    name: inventory-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn core.wsgi:application --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: PYTHON_VERSION
        value: "3.12"
    healthCheckPath: /api/inventory/products/
    autoDeploy: true

databases:
  - name: inventory-db
    databaseName: inventory
    plan: free
