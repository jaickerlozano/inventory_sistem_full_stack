services:
  - type: web
    name: inventory-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: inventory-sistem-full-stack.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://inventory-sistem-frontend.onrender.com,http://localhost:5173
      - key: PYTHON_VERSION
        value: "3.12"
    healthCheckPath: /api/inventory/products/
    autoDeploy: true

  - type: web
    name: inventory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://inventory-sistem-full-stack.onrender.com/api/inventory
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
